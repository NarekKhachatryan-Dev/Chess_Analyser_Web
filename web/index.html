<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChessSolver</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>ChessSolver</h1>
      <label>FEN <input id="fen" size="70" value="r1b2kr1/ppppn3/5p1p/3P3P/4P1q1/2Q5/PB4P1/nN3RK1 w - - 0 21"></label>
      <section class="editor">
        <div class="board-area">
          <button id="flip-board" type="button">Flip board</button>
          <div class="board-frame">
            <div id="ranks" class="ranks" aria-hidden="true"></div>
            <div id="board" aria-label="Chess board"></div>
          </div>
          <div id="files" class="files" aria-hidden="true"></div>
        </div>
        <div class="right-column">
          <section class="solve-panel">
            <h2>Solve</h2>
            <label>Mate in N <input id="depth" type="number" min="1" max="5" value="3"></label>
            <p id="depth-error" class="status error" role="alert"></p>
            <div class="solve-actions">
              <button id="solve" class="primary">Solve</button>
              <button id="cancel" disabled>Cancel</button>
            </div>
            <p id="progress" aria-live="polite"></p>
            <output id="result"></output>
            <p id="line"></p>
            <nav>
              <button id="previous" disabled>Previous</button>
              <span id="move-count" aria-live="polite">Move 0 of 0</span>
              <button id="next" disabled>Next</button>
            </nav>
          </section>
          <section class="controls">
            <h2>Position editor</h2>
            <div id="palette"></div>
            <button id="clear-board" type="button">Clear board</button>
            <button id="start-position" type="button">Start position</button>
            <label>Side to move
              <select id="side"><option value="w">White</option><option value="b">Black</option></select>
            </label>
            <label>Castling rights <input id="castling" value="-"></label>
            <label>En passant <input id="ep" value="-"></label>
            <button id="validate">Validate</button>
            <output id="validation"></output>
          </section>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
